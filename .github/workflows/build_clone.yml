name: Build eFootball Clone APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name efootball_clone_hub --org com.alireza .

      - run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: efootball-clone-release
          path: build/app/outputs/flutter-apk/app-release.apk
